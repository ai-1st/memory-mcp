AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Memory MCP Server

Globals:
  Function:
    Timeout: 300
    MemorySize: 4096
    Runtime: nodejs22.x
    Architectures:
      - arm64

Resources:
  MemoryMcpTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-table'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  VectorBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-vectors-${AWS::AccountId}'
    DeletionPolicy: Retain

  S3VectorsBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Sub '${AWS::StackName}-s3v-${AWS::AccountId}'

  S3VectorsIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      IndexName: chunks
      VectorBucketArn: !Ref S3VectorsBucket
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - type
          - docId
          - title
          - summary

  McpServerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: src/
      Environment:
        Variables:
          TABLE_NAME: !Ref MemoryMcpTable
          VECTOR_BUCKET: !Ref S3VectorsBucket
          VECTOR_INDEX: !Ref S3VectorsIndex
          BM25_BUCKET: !Ref VectorBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MemoryMcpTable
        - Statement:
            - Effect: Allow
              Action:
                - s3vectors:QueryVectors
                - s3vectors:GetVectors
              Resource: !GetAtt S3VectorsIndex.IndexArn
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub '${VectorBucket.Arn}/*'
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt VectorBucket.Arn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - GET
            - POST
          AllowHeaders:
            - Content-Type
            - Authorization
          MaxAge: 300

  # ─── Admin REST API ─────────────────────────────────────────────────

  AdminApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: admin/index.handler
      CodeUri: src/
      Timeout: 300
      Environment:
        Variables:
          TABLE_NAME: !Ref MemoryMcpTable
          VECTOR_BUCKET: !Ref S3VectorsBucket
          VECTOR_INDEX: !Ref S3VectorsIndex
          BM25_BUCKET: !Ref VectorBucket
          SCRAPE_WORKER_FN: !Ref ScrapeWorkerFunction
          PROCESS_WORKER_FN: !Ref ProcessWorkerFunction
          ADMIN_SECRET_ARN: memory-mcp/admin-password
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MemoryMcpTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:memory-mcp/admin-password-*'
        - Statement:
            - Effect: Allow
              Action:
                - s3vectors:QueryVectors
                - s3vectors:GetVectors
                - s3vectors:PutVectors
                - s3vectors:DeleteVectors
                - s3vectors:ListVectors
              Resource: !GetAtt S3VectorsIndex.IndexArn
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt ScrapeWorkerFunction.Arn
                - !GetAtt ProcessWorkerFunction.Arn
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub '${VectorBucket.Arn}/*'
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt VectorBucket.Arn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - GET
            - POST
            - PUT
            - DELETE
          AllowHeaders:
            - Content-Type
            - Authorization
          MaxAge: 300

  # ─── Worker Lambdas ─────────────────────────────────────────────────

  ScrapeWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: workers/scrapeWorker.handler
      CodeUri: src/
      Timeout: 900
      Environment:
        Variables:
          TABLE_NAME: !Ref MemoryMcpTable
          PROCESS_WORKER_FN: !Ref ProcessWorkerFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MemoryMcpTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt ProcessWorkerFunction.Arn

  ProcessWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: workers/processWorker.handler
      CodeUri: src/
      Timeout: 900
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          TABLE_NAME: !Ref MemoryMcpTable
          VECTOR_BUCKET: !Ref S3VectorsBucket
          VECTOR_INDEX: !Ref S3VectorsIndex
          BM25_BUCKET: !Ref VectorBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MemoryMcpTable
        - Statement:
            - Effect: Allow
              Action:
                - s3vectors:QueryVectors
                - s3vectors:GetVectors
                - s3vectors:PutVectors
                - s3vectors:DeleteVectors
                - s3vectors:ListVectors
              Resource: !GetAtt S3VectorsIndex.IndexArn
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub '${VectorBucket.Arn}/*'
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt VectorBucket.Arn

Outputs:
  McpServerUrl:
    Description: Lambda Function URL for MCP Server (read-only, for agents)
    Value: !GetAtt McpServerFunctionUrl.FunctionUrl
  AdminApiUrl:
    Description: Lambda Function URL for Admin REST API (for UI)
    Value: !GetAtt AdminApiFunctionUrl.FunctionUrl
  McpServerFunction:
    Description: MCP Server Lambda Function ARN
    Value: !GetAtt McpServerFunction.Arn
  TableName:
    Description: DynamoDB Table Name
    Value: !Ref MemoryMcpTable
  VectorBucket:
    Description: S3 bucket for BM25 indexes
    Value: !Ref VectorBucket
  S3VectorsBucket:
    Description: S3 Vectors bucket for similarity search
    Value: !Ref S3VectorsBucket
  S3VectorsIndexArn:
    Description: S3 Vectors index ARN
    Value: !Ref S3VectorsIndex
